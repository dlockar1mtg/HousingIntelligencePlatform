name: Housing production
# Weekly: refresh Zillow / Realtor.com / Census, run the configured model (V11) on live FRED, build and validate the UIP contract,
# publish it as the housing-production-<run> artifact, and keep the monitoring state in state/.
on:
  schedule:
    - cron: "20 13 * * 0"     # Sunday 13:20 UTC (FRED, Zillow and Realtor.com update weekly to monthly)
    - cron: "20 13 * * 1"     # Monday backup; skips when Sunday's run already published
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash          # explicit bash runs with -o pipefail, so `cmd | tee log` fails when cmd fails
    steps:
      - uses: actions/checkout@v4
      - name: Skip a backup run when this week's run already published
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ] && [ -f state/latest_contract.json ]; then
            last=$(python3 -c "import json;print(json.load(open('state/latest_contract.json'))['generated_at_utc'][:10])")
            if [ "$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 86400 ))" -lt 2 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::published $last; backup run skipped"; exit 0; fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-dev.txt && python -m pytest -q
      - name: Restore the market files
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            inputs/zhvi_metro.csv
            inputs/zori_metro.csv
            inputs/realtor_inventory.csv
          key: housing-inputs-v1-${{ github.run_id }}
          restore-keys: housing-inputs-v1-
      - name: Refresh the market files (fail-safe) and Census income
        if: steps.gate.outputs.run == 'true'
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          for f in zhvi_metro zori_metro realtor_inventory; do
            if [ ! -f inputs/$f.csv ]; then   # first run, or the Actions cache was evicted: seed with the baseline
              gunzip -c baseline/v10-2026-09-13/inputs/$f.csv.gz > inputs/$f.csv
              echo "::warning title=$f::not in the Actions cache; seeded from the 2026-09-13 baseline (the refresh below must replace it)"
            fi
          done
          python -c "from data_sources.market_file_updater import refresh_market_files; refresh_market_files()"
          # V11 downloads every ACS 5-year release from 2009 and refuses a year with a county missing;
          # on failure the committed yearly history is used (its age is checked below).
          python -c "from data_sources.census_loader import download_census_income; download_census_income()" || { echo "::warning title=Census::refresh failed; the committed Census income files are used"; git checkout -- inputs/census_income.csv inputs/census_income_county_detail.csv; }
          python - <<'PY'
          import pandas as pd, sys
          r = pd.read_csv("outputs/v10_data_freshness_report.csv")
          for _, x in r.iterrows():
              level = "warning" if x["status"] == "FAILED-SAFE" else "notice"
              print(f"::{level} title={x['dataset']}::{x['status']} latest {x['latest_observation']} Wichita {x['wichita_coverage']} DFW {x['dfw_coverage']}")
          if not (r["wichita_coverage"].eq("PASS").all() and r["dfw_coverage"].eq("PASS").all()):
              sys.exit("market coverage failed: not running the forecast")
          PY
          # Per-source ages (validation/freshness.py): ::warning past the warning age, ::error and stop past the limit.
          python -m validation.freshness outputs/v10_data_freshness_report.csv
      - name: Mortgage-rate outlook (live FRED; docs/RATES_PLAN.md); the V11.1 Monte Carlo draws rates from it
        if: steps.gate.outputs.run == 'true'
        run: python -m rates.outlook --out outputs/rates_outlook.json --notice
      - name: Run the model on live FRED (config/settings.json model_version)
        if: steps.gate.outputs.run == 'true'
        run: |
          cp state/v9_monitoring_history.csv state/v9_monitoring_current_snapshot.csv outputs/
          python run_forecast.py | tee forecast.log
          python -m validation.freshness outputs/v10_data_freshness_report.csv outputs/data_quality.json
      - name: Build and validate the UIP contract
        if: steps.gate.outputs.run == 'true'
        run: python publish_uip.py --package uip-package | tee publish.log && echo "::notice title=Housing contract::$(tail -1 publish.log | cut -c1-400)"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: housing-production-${{ github.run_id }}
          path: uip-package/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: housing-run-outputs-${{ github.run_id }}
          path: |
            outputs/
            forecast.log
          retention-days: 14
      - name: Save the market files
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            inputs/zhvi_metro.csv
            inputs/zori_metro.csv
            inputs/realtor_inventory.csv
          key: housing-inputs-v1-${{ github.run_id }}
      - name: Commit the monitoring state
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        run: |
          cp outputs/v9_monitoring_history.csv outputs/v9_monitoring_current_snapshot.csv outputs/v10_data_freshness_report.csv state/
          cp uip-package/housing_uip_contract.json state/latest_contract.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Housing production $(date -u +%F)"
          git push
