name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Install the exact versions in requirements-lock.txt (see that file); Dependabot proposes updates monthly.
  PIP_CONSTRAINT: requirements-lock.txt

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
