name: Reproduce the V10 baseline and check V11
# Phase 2 gate, online half: rebuild the 2026-09-13 run from live FRED plus the committed baseline input
# files and check it lands in the same decision state. No personal profile is used, so the household
# outputs are skipped; the market side is what is compared.
# Each run is two ~40-minute jobs (about 80 billed minutes), so it no longer runs on every push to a pull
# request: add the label "reproduce" to the pull request (or run it by hand) when a change needs the check.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: reproduce-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    if: github.event_name != 'pull_request' || github.event.label.name == 'reproduce'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash          # explicit bash runs with -o pipefail, so `cmd | tee log` fails when cmd fails
    env:
      HOUSING_MODEL_VERSION: V10      # the baseline is V10; production runs V11 (config/settings.json)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install the baseline input files
        run: |
          for f in zhvi_metro zori_metro realtor_inventory; do gunzip -c baseline/v10-2026-09-13/inputs/$f.csv.gz > inputs/$f.csv; done
          cp baseline/v10-2026-09-13/inputs/census_income*.csv inputs/
      - name: Run V10 (live FRED)
        run: python run_forecast.py | tee forecast.log
      - name: Compare with the baseline
        run: |
          python - <<'PY'
          import pandas as pd, sys
          base = pd.read_csv("baseline/v10-2026-09-13/outputs/v10_latest_forecast.csv").set_index("market")
          now = pd.read_csv("outputs/v10_latest_forecast.csv").set_index("market")
          ok = True
          for m in base.index:
              b, n = base.loc[m], now.loc[m]
              same = b["entry_signal"] == n["entry_signal"]
              ok &= bool(same) and abs(b["entry_score"] - n["entry_score"]) <= 2.0
              print(f"::notice title={m}::baseline {b['entry_score']:.2f} {b['entry_signal']} | now {n['entry_score']:.2f} {n['entry_signal']} | predicted growth {b['predicted_12m_growth_pct']:.2f}% -> {n['predicted_12m_growth_pct']:.2f}%")
          rb = pd.read_csv("baseline/v10-2026-09-13/outputs/v10_market_ranking.csv").set_index("market")
          rn = pd.read_csv("outputs/v10_market_ranking.csv").set_index("market")
          for m in rb.index:
              print(f"::notice title={m} ranking::baseline rank {rb.loc[m,'market_rank']} | now {rn.loc[m,'market_rank']}")
              ok &= int(rb.loc[m, "market_rank"]) == int(rn.loc[m, "market_rank"])
          print("::notice title=Gate::" + ("same decision state as the V10 baseline" if ok else "decision state differs from the V10 baseline"))
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-reproduction-${{ github.run_id }}
          path: |
            outputs/
            forecast.log
          retention-days: 14

  v11:
    if: github.event_name != 'pull_request' || github.event.label.name == 'reproduce'
    # The production model (V11.1) on live FRED with the baseline market files: builds and validates the contract.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash          # explicit bash runs with -o pipefail, so `cmd | tee log` fails when cmd fails
    env:
      HOUSING_MODEL_VERSION: V11.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install the baseline market files (Census income is the committed yearly history)
        run: for f in zhvi_metro zori_metro realtor_inventory; do gunzip -c baseline/v10-2026-09-13/inputs/$f.csv.gz > inputs/$f.csv; done
      - name: Mortgage-rate outlook (live FRED); the V11.1 Monte Carlo draws rates from it
        run: python -m rates.outlook --out outputs/rates_outlook.json
      - name: Run V11.1 (live FRED)
        run: python run_forecast.py | tee forecast.log
      - name: Build and validate the contract
        run: |
          python publish_uip.py --package uip-package | tee publish.log
          python - <<'PY'
          import json
          c = json.load(open("uip-package/housing_uip_contract.json"))
          for m in c["markets"]:
              cal, wf = m["calibration"], m.get("walk_forward") or {}
              print(f"::notice title={m['market']} {c['model_version']}::{m['market_state_as_of']} score {m['entry_score']} {m['signal']} at {m['mortgage_30yr']}% ({m.get('rate_features_as_of')}) | next 12m {m['predicted_12m_growth']:+.2%} | walk-forward MAE {wf.get('mae')} over {wf.get('quarters')} quarters | timing test {cal['status']} rank {cal.get('rank_correlation')} over {cal.get('quarters')} quarters")
          print(f"::notice title=Contract::{c['contract_version']} {c['model_version']} known issues {c['known_issues']} warnings {c['warnings']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-check-${{ github.run_id }}
          path: |
            uip-package/
            outputs/
            forecast.log
          retention-days: 14
