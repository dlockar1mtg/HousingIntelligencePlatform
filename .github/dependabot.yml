# Monthly, one grouped pull request per ecosystem. The repository's tests run on each one;
# merge when they pass. Python versions live in requirements-lock.txt (applied via PIP_CONSTRAINT).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-packages:
        patterns: ["*"]
    # Python major versions (pandas 3, DuckDB 2, yfinance 1, ...) can change behavior the tests
    # do not cover, so they are never proposed here; take each one on deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # This repository runs on Python 3.11; numpy 2.5+ and scipy 1.18+ need Python 3.12.
      # Remove these two lines when the workflows move to a newer Python.
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
