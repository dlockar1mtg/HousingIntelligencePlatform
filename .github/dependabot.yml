# Monthly, one grouped pull request per ecosystem. The repository's tests run on each one;
# merge when they pass. Python versions live in requirements-lock.txt (applied via PIP_CONSTRAINT).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-packages:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
